<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TooToo — Footer (dev)</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body {
      justify-content: flex-end;
    }
  </style>
</head>

<body>

  <!-- @part:footer:start -->
  <footer class="app-footer">
    <span class="app-footer-brand">
      <img class="app-footer-mark" src="favicon.ico" width="18" height="18" alt="">
      <span id="footerCopyright"></span>
    </span>
    <a class="app-footer-license" href="https://opensource.org/licenses" target="_blank" rel="noopener">License</a>
  </footer>
  <!-- @part:footer:end -->

  <script src="../../js/core.js"></script>
  <script src="../../mock/mock-data.js"></script>
  <script src="footer.js"></script>
  <script>
    renderFooter();
    // Standalone page: the mark's static src="favicon.ico" resolves relative to
    // this file (src/components/footer/), so point it at the dev folder's generated one.
    document.querySelector( '.app-footer-mark' ).src = '../../../favicon.ico';
  </script>

</body>

</html>
