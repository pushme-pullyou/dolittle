<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-07-06 12:05">
  <title>TooToo — Header (dev)</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    /* Page-only scaffolding. Ignored by the assembler (outside @part). */
    .dev-note {
      margin: 1rem;
      padding: 0.75rem 1rem;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      background: var(--secondary-bg);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .dev-note code {
      background: var(--hover-bg);
      padding: 0 0.25rem;
      border-radius: 4px;
    }

    .dev-menu {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.5rem;
      overflow-y: auto;
    }

    .dev-menu button {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: inherit;
      text-align: left;
      padding: 0.4rem 0.6rem;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
    }

    .dev-menu button:hover,
    .dev-menu button:focus-visible,
    .dev-menu button[aria-pressed="true"] {
      background: var(--hover-bg);
      color: var(--highlight-fg);
    }

    .dev-content {
      min-width: 0;
      overflow-y: auto;
      padding-bottom: 1rem;
    }

    .dev-controls {
      margin: 0 1rem 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--secondary-bg);
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.5rem 0.75rem;
      align-items: center;
      max-width: 480px;
    }

    .dev-controls h2 {
      grid-column: 1 / -1;
      margin: 0 0 0.25rem;
      font-size: 1rem;
    }

    .dev-controls label {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .dev-controls input {
      font: inherit;
      padding: 0.2rem 0.4rem;
    }

    #devFonts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      margin: 0 1rem 0.5rem;
    }

    #devFonts span {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    #devFonts button {
      font: inherit;
      font-size: 0.85rem;
      padding: 0.2rem 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--secondary-bg);
      cursor: pointer;
    }

    #devFonts button:hover {
      border-color: var(--highlight-color);
      color: var(--highlight-color);
    }
  </style>
</head>

<body>

  <!-- @part:header:start -->
  <header>
    <button id="btnToggleSidebar" class="header-btn" title="Close sidebar (Ctrl/⌘ B)" aria-label="Toggle sidebar"
      aria-controls="sidebar" aria-expanded="true">☰</button>
    <a id="headerGitHub" href="." title="View on GitHub" aria-label="View on GitHub">
      <!-- App brand mark: the deployment's favicon.ico (static; the standalone
           harness rewrites the src to ../../../favicon.ico). aria-hidden: the anchor's
           aria-label names the link. -->
      <img id="headerBrand" src="favicon.ico" width="18" height="18" alt="" aria-hidden="true">
    </a>

    <a id="headerTitle" href="." title="Reload" aria-label="Reload page">TooToo</a>

    <!-- Branch switcher: hidden in markup until branches load, then sidebar.js fills
         #branchName + the menu and unhides it (header markup, sidebar.js owns the
         behavior). The dev harness below toggles it standalone for preview. -->
    <span class="branch-control">
      <button id="btnBranch" class="branch-switcher" type="button" hidden aria-haspopup="listbox" aria-expanded="false"
        title="Switch branch">
        <span class="branch-glyph" aria-hidden="true">⎇</span>
        <span id="branchName"></span>
        <span class="branch-caret" aria-hidden="true">▾</span>
      </button>
      <div id="branchMenu" class="branch-menu" role="listbox" aria-label="Branches" hidden></div>
    </span>

    <!-- ⌂ hub link: hidden unless CONFIG.homeUrl is set (header.js wires it at init) -->
    <a id="headerHome" class="header-btn" hidden title="Home" aria-label="Home page">⌂</a>

    <span id="headerSubtitle" class="header-subtitle" hidden></span>

    <button id="btnDarkMode" class="header-btn dark-mode-btn" title="Toggle Dark Mode"
      aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
    <button id="btnFontDec" class="header-btn" title="Decrease Font Size" aria-label="Decrease font size">A−</button>
    <button id="btnFontInc" class="header-btn" title="Increase Font Size" aria-label="Increase font size">A+</button>
    <button id="btnHelp" class="header-btn" title="About this app" aria-label="About this app"
      aria-pressed="false">?</button>
    <button id="btnToken" class="header-btn" title="GitHub API rate limit — click to set a token"
      aria-label="Set GitHub personal access token" aria-pressed="false">⚙️</button>
    <div id="rateBadge" class="rate-limit-badge" title="API Rate Limit" aria-live="polite"></div>
  </header>
  <!-- @part:header:end -->

  <main>
    <aside class="sidebar" id="sidebar" aria-label="Preview menu">
      <div class="panel-header">
        <h3>Installs</h3>
      </div>
      <nav class="dev-menu" aria-label="TooToo install previews">
        <button type="button" data-owner="heritage-happenings" data-repo="heritage-happenings.github.io" data-branch="main" aria-pressed="false">heritage-happenings.github.io</button>
        <button type="button" data-owner="heritage-happenings" data-repo="documents" data-branch="main" aria-pressed="false">heritage-happenings-documents</button>
        <button type="button" data-owner="pushme-pullyou" data-repo="assets" data-branch="main" aria-pressed="false">pushme-pullyou-assets</button>
        <button type="button" data-owner="pushme-pullyou" data-repo="2019" data-branch="master" aria-pressed="false">pushme-pullyou-github</button>
        <button type="button" data-owner="pushme-pullyou" data-repo="pushme-pullyou.github.io" data-branch="main" aria-pressed="false">pushme-pullyou-github-io</button>
        <button type="button" data-owner="theo-armour" data-repo="2025" data-branch="main" aria-pressed="false">theo-armour-2025</button>
        <button type="button" data-owner="theo-armour" data-repo="2026" data-branch="main" aria-pressed="false">theo-armour-2026</button>
        <button type="button" data-owner="theo-armour" data-repo="aa" data-branch="main" aria-pressed="false">theo-armour-aa</button>
        <button type="button" data-owner="theo-armour" data-repo="agenda" data-branch="main" aria-pressed="false">theo-armour-agenda</button>
        <button type="button" data-owner="theo-armour" data-repo="collection" data-branch="main" aria-pressed="false">theo-armour-collection</button>
        <button type="button" data-owner="theo-armour" data-repo="genealogy" data-branch="main" aria-pressed="false">theo-armour-genealogy</button>
        <button type="button" data-owner="theo-armour" data-repo="pages" data-branch="main" aria-pressed="false">theo-armour-pages</button>
        <button type="button" data-owner="theo-armour" data-repo="qdata" data-branch="main" aria-pressed="false">theo-armour-qdata</button>
        <button type="button" data-owner="theo-armour" data-repo="sandbox" data-branch="main" aria-pressed="false">theo-armour-sandbox</button>
        <button type="button" data-owner="theo-armour" data-repo="wikitheo" data-branch="main" aria-pressed="false">theo-armour-wikitheo</button>
        <button type="button" data-owner="heritage-happenings" data-repo="tech" data-branch="main" aria-pressed="false">tech</button>
      </nav>
    </aside>

    <section class="content-area dev-content" id="contentArea" aria-label="Header preview">
      <div class="panel-header file-header">
        <h3>Header component preview</h3>
      </div>
      <div id="contentBody">
        <div class="dev-controls">
          <h2>🎛️ Header preview settings</h2>
          <label for="ctlOwner">owner</label>
          <input id="ctlOwner" type="text" placeholder="e.g. pushme-pullyou">
          <label for="ctlRepo">repo</label>
          <input id="ctlRepo" type="text" placeholder="e.g. tootoo">
          <label for="ctlBranch">branch</label>
          <input id="ctlBranch" type="text" placeholder="e.g. main">
          <label for="ctlSubtitle">subtitle</label>
          <input id="ctlSubtitle" type="text" placeholder="(empty)">
          <label for="ctlColor">themeColor</label>
          <input id="ctlColor" type="color">
          <label for="ctlAppName">appName</label>
          <input id="ctlAppName" type="text" placeholder="shown when owner+repo empty">
          <label for="ctlSource">sourceRepoUrl</label>
          <input id="ctlSource" type="url" placeholder="https://github.com/…">
          <label for="ctlFontUrl">headingFontUrl</label>
          <input id="ctlFontUrl" type="url" placeholder="Google Fonts CSS or .woff2/.ttf URL">
          <label for="ctlFont">headingFont</label>
          <input id="ctlFont" type="text" placeholder='e.g. "Patua One", serif'>
        </div>

        <div class="dev-presets" id="devFonts">
          <span>Heading font:</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Component dependencies. -->
  <script src="../../js/core.js"></script>
  <script src="../../mock/mock-data.js"></script>
  <script src="header.js"></script>

  <!-- Dev harness: seed control values, then mutate CONFIG + re-render. -->
  <script>
    const byId = ( id ) => document.getElementById( id );

    initHeader();
    // Standalone page: the brand mark's static src="favicon.ico" resolves relative to
    // this file (src/components/header/), so point it at the dev folder's generated one.
    byId( 'headerBrand' ).src = '../../../favicon.ico';
    byId( 'ctlOwner' ).value = state.owner || CONFIG.owner || '';
    byId( 'ctlRepo' ).value = state.repo || CONFIG.repo || '';
    byId( 'ctlBranch' ).value = state.branch || CONFIG.branch || '';
    byId( 'ctlSubtitle' ).value = CONFIG.subtitle || '';
    // Default to the live --highlight-color from styles.css (one source of truth)
    // rather than a hard-coded hex; initAppearance has already applied it.
    byId( 'ctlColor' ).value = CONFIG.themeColor ||
      getComputedStyle( document.documentElement ).getPropertyValue( '--highlight-color' ).trim() || '#2563eb';
    byId( 'ctlAppName' ).value = CONFIG.appName || '';
    byId( 'ctlSource' ).value = CONFIG.sourceRepoUrl || '';
    byId( 'ctlFontUrl' ).value = CONFIG.headingFontUrl || '';
    byId( 'ctlFont' ).value = CONFIG.headingFont || '';

    const reflectConfig = ( id, key ) => byId( id ).addEventListener( 'input', ( e ) => {
      CONFIG[ key ] = e.target.value; updateHeaderFromConfig();
    } );

    // sourceRepoUrl is wired into #headerGitHub once at init (header.js), so mirror
    // it onto the href directly — updateHeaderFromConfig doesn't touch the link.
    const reflectSource = () => byId( 'ctlSource' ).addEventListener( 'input', ( e ) => {
      CONFIG.sourceRepoUrl = e.target.value;
      byId( 'headerGitHub' ).setAttribute( 'href', e.target.value || '#' );
    } );

    // headingFont sets --heading-font (consumed by #headerTitle + h1–h6 CSS);
    // empty clears it so the var falls back to the body font. A font-file URL is
    // registered under this family, so re-register when the family changes.
    const reflectHeadingFont = () => byId( 'ctlFont' ).addEventListener( 'input', ( e ) => {
      const value = e.target.value;
      CONFIG.headingFont = value;
      const root = document.documentElement.style;
      if ( value ) root.setProperty( '--heading-font', value );
      else root.removeProperty( '--heading-font' );
      if ( isFontFileUrl( CONFIG.headingFontUrl ) ) loadFontFile( CONFIG.headingFontUrl, firstFontFamily( value ) );
    } );

    // headingFontUrl loads a stylesheet or a font file (core.js loadFontFile). Reuse a
    // single <link> (vs. core.js's applyHeadingFont, which appends a fresh one each
    // call) so live edits don't pile up stale font links in the dev page's <head>.
    const reflectFontUrl = () => byId( 'ctlFontUrl' ).addEventListener( 'input', ( e ) => {
      const value = e.target.value.trim();
      CONFIG.headingFontUrl = value;
      let link = byId( 'devHeadingFontLink' );
      if ( !value || isFontFileUrl( value ) ) {
        link?.remove();
        if ( value ) loadFontFile( value, firstFontFamily( CONFIG.headingFont ) );
        return;
      }
      if ( !link ) {
        link = document.createElement( 'link' );
        link.id = 'devHeadingFontLink';
        link.rel = 'stylesheet';
        document.head.appendChild( link );
      }
      link.href = value;
    } );

    const reflectState = ( id, key ) => byId( id ).addEventListener( 'input', ( e ) => {
      const value = e.target.value.trim();
      state[ key ] = value;
      CONFIG[ key ] = value;
      updateHeaderFromConfig();
      syncBranchChip();
    } );

    const syncBranchChip = () => {
      const branch = state.branch || CONFIG.branch || '';
      const btn = byId( 'btnBranch' );
      const name = byId( 'branchName' );
      if ( !btn || !name ) return;
      if ( !branch ) {
        btn.hidden = true;
        name.textContent = '';
        return;
      }
      name.textContent = branch;
      btn.hidden = false;
      btn.title = `Branch: ${ branch } — click to switch`;
      btn.setAttribute( 'aria-label', `Branch ${ branch } — click to switch` );
    };

    reflectState( 'ctlOwner', 'owner' );
    reflectState( 'ctlRepo', 'repo' );
    reflectState( 'ctlBranch', 'branch' );
    reflectConfig( 'ctlSubtitle', 'subtitle' );
    reflectConfig( 'ctlColor', 'themeColor' );
    reflectConfig( 'ctlAppName', 'appName' );
    reflectSource();
    reflectHeadingFont();
    reflectFontUrl();
    syncBranchChip();

    document.querySelectorAll( '.dev-menu button' ).forEach( ( button ) => {
      button.addEventListener( 'click', () => {
        const setInput = ( id, value ) => {
          const input = byId( id );
          input.value = value;
          input.dispatchEvent( new Event( 'input', { bubbles: true } ) );
        };
        setInput( 'ctlOwner', button.dataset.owner );
        setInput( 'ctlRepo', button.dataset.repo );
        setInput( 'ctlBranch', button.dataset.branch );
        setInput( 'ctlSource', `https://github.com/${ button.dataset.owner }/${ button.dataset.repo }` );
        document.querySelectorAll( '.dev-menu button' ).forEach( ( item ) =>
          item.setAttribute( 'aria-pressed', String( item === button ) ) );
      } );
    } );

    // ── ? / ⚙️ panels: header.js renders them via content.js/sidebar.js helpers this
    // page doesn't load. Minimal stand-ins below; the preview header + controls are
    // detached (not re-rendered) while a panel is open, so their listeners survive. ──
    let savedPreview = null;
    const restorePreview = () => {
      if ( !savedPreview ) return;
      byId( 'contentArea' ).querySelector( '.file-header' ).replaceWith( savedPreview.header );
      byId( 'contentBody' ).replaceChildren( savedPreview.body );
      savedPreview = null;
    };
    const makeSimpleHeader = ( title ) => {
      const d = document.createElement( 'div' );
      d.className = 'panel-header file-header';
      d.innerHTML = `<div class="file-title"><h3 id="breadcrumbs">${ escapeHTML( title ) }</h3></div>`;
      return d;
    };
    const setContentHeader = ( el ) => {
      const existing = byId( 'contentArea' ).querySelector( '.file-header' );
      if ( !savedPreview ) {
        const body = document.createDocumentFragment();
        body.append( ...byId( 'contentBody' ).childNodes );
        savedPreview = { header: existing, body };
      }
      existing.replaceWith( el );
    };
    const selectFile = restorePreview;
    const autoSelectReadme = restorePreview;
    const runSelfTest = () => {
      byId( 'btnSelfTest' ).insertAdjacentHTML( 'afterend',
        '<p class="dev-note">Self-test needs the full app (content renderers + repo tree). Run it from <code>index.html</code>.</p>' );
    };

    // The harness doesn't load main.js (so applyHeadingFont never runs), yet the
    // controls are seeded from CONFIG.headingFont. Apply that seed through the managed
    // -link path so the preview matches the panel — not a raw applyHeadingFont(), which
    // would append an unmanaged <link> and reintroduce the stale-link pileup.
    byId( 'ctlFontUrl' ).dispatchEvent( new Event( 'input' ) );
    byId( 'ctlFont' ).dispatchEvent( new Event( 'input' ) );

    // ── Quick heading-font swatches: each button just drives the headingFont +
    // headingFontUrl controls (via their 'input' handlers). 'None' clears both to
    // prove the system-font fallback. Buttons render in their own face once loaded. ──
    const FONTS = [
      { name: 'Fraunces', headingFont: '"Fraunces", serif', headingFontUrl: 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap' },
      { name: 'Space Grotesk', headingFont: '"Space Grotesk", sans-serif', headingFontUrl: 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap' },
      { name: 'Bitter', headingFont: '"Bitter", serif', headingFontUrl: 'https://fonts.googleapis.com/css2?family=Bitter:wght@600&display=swap' },
      { name: 'Sigmar', headingFont: '"Sigmar", sans-serif', headingFontUrl: 'https://fonts.googleapis.com/css2?family=Sigmar&display=swap' },
      { name: 'Rammetto One', headingFont: '"Rammetto One", sans-serif', headingFontUrl: 'https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap' },
      { name: 'Windsor', headingFont: '"Windsor", serif', headingFontUrl: 'https://pushme-pullyou.github.io/assets/fonts/Windsor%20Regular.ttf' },
      { name: 'None', headingFont: '', headingFontUrl: '' },
    ];
    const applyFont = ( f ) => {
      const fire = ( id, value ) => {
        const el = byId( id );
        el.value = value;
        el.dispatchEvent( new Event( 'input', { bubbles: true } ) );
      };
      // Clear the URL, set the family, then the URL: a font file registers under the
      // current family, so it must never pair with the previous swatch's name.
      fire( 'ctlFontUrl', '' );
      fire( 'ctlFont', f.headingFont );
      fire( 'ctlFontUrl', f.headingFontUrl );
    };
    const fontBar = byId( 'devFonts' );
    FONTS.forEach( ( f ) => {
      const btn = document.createElement( 'button' );
      btn.type = 'button';
      btn.textContent = f.name;
      if ( f.headingFont ) btn.style.fontFamily = f.headingFont;   // preview the face on the button itself
      btn.addEventListener( 'click', () => applyFont( f ) );
      fontBar.appendChild( btn );
    } );
  </script>

</body>

</html>
